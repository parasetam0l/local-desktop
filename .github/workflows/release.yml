# Builds both apps from the same commit with the same version and creates a
# draft GitHub release with them: LocalDesktop for the Mac, signed with
# Developer ID and notarized, as a DMG, and the iPhone and iPad app as an
# Ad Hoc IPA for the devices registered with the team. It runs only when
# started by hand: Actions → Release → Run workflow.
#
# One-time setup (certificate, keys, secrets): docs/RELEASING.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.1.0 (tagged v1.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::The version must look like 1.2 or 1.2.3, not '$VERSION'."
            exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists."
            exit 1
          fi

      - name: Check the secrets
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          missing=()
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD NOTARY_APPLE_ID NOTARY_PASSWORD \
                      APP_STORE_CONNECT_KEY APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]} (see docs/RELEASING.md)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release notes list the commits since the last release

      - name: Install tools
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test -project LocalDesktop.xcodeproj -scheme LocalDesktopTests \
            -destination "platform=macOS" 2>&1 \
            | { grep -E "error:|Test Case .* failed|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)" || true; }

      - name: Import the certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          # project.yml pins the host's signing identity by certificate hash.
          expected="$(awk '$1 == "CODE_SIGN_IDENTITY:" { gsub(/"/, "", $2); print $2; exit }' project.yml)"
          security find-identity -v -p codesigning "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -q "$expected" \
            || { echo "::error::The certificate in DEVELOPER_ID_P12_BASE64 isn't the one project.yml signs with ($expected)."; exit 1; }

      - name: Build
        run: |
          set -o pipefail
          # A new, higher build number every time, so Sparkle sees each release as
          # newer. Both apps get the same one.
          build_number="$(date +%s)"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          xcodebuild archive \
            -project LocalDesktop.xcodeproj \
            -scheme LocalDesktopHost \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/LocalDesktop.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$build_number" 2>&1 \
            | tee "$RUNNER_TEMP/xcodebuild.log" \
            | { grep -E "error:|warning: .*(sign|profile|entitlement)|ARCHIVE (SUCCEEDED|FAILED)" || true; }
          echo "APP=$RUNNER_TEMP/LocalDesktop.xcarchive/Products/Applications/LocalDesktop.app" >> "$GITHUB_ENV"

      - name: Check the signatures
        run: |
          sparkle="$APP/Contents/Frameworks/Sparkle.framework/Versions/B"
          codesign --verify --deep --strict --verbose=2 "$APP"
          for bundle in "$APP" "$sparkle/Autoupdate" "$sparkle/Updater.app" \
                        "$sparkle/XPCServices/Installer.xpc" "$sparkle/XPCServices/Downloader.xpc"; do
            details="$(codesign -dvv "$bundle" 2>&1)"
            grep -q "Authority=Developer ID Application" <<< "$details" \
              || { echo "::error::$bundle is not signed with Developer ID"; exit 1; }
            grep -q "Timestamp=" <<< "$details" \
              || { echo "::error::$bundle has no secure timestamp"; exit 1; }
          done
          codesign -dvv "$APP" 2>&1 | grep -q "flags=.*runtime" \
            || { echo "::error::The app is not built with the hardened runtime"; exit 1; }
          lipo -archs "$APP/Contents/MacOS/LocalDesktop"
          # Updates are verified with this key; without it none can install.
          key="$(plutil -extract SUPublicEDKey raw -o - "$APP/Contents/Info.plist")"
          [[ "$(printf '%s' "$key" | base64 --decode 2>/dev/null | wc -c | tr -d ' ')" == 32 ]] \
            || { echo "::error::SUPublicEDKey in project.yml is not a Sparkle public key: $key"; exit 1; }

      - name: Build the iPhone app
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          # Archived unsigned and signed only on export: Xcode signs with the team's
          # cloud-managed Apple Distribution certificate and an Ad Hoc profile for
          # every enabled device, creating or renewing both with the API key.
          xcodebuild archive \
            -project LocalDesktop.xcodeproj \
            -scheme LocalDesktopClient \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/LocalDesktopClient.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee -a "$RUNNER_TEMP/xcodebuild.log" \
            | { grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true; }
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APP_STORE_CONNECT_KEY" > "$key"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LocalDesktopClient.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios" \
            -exportOptionsPlist Packaging/ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" 2>&1 \
            | tee -a "$RUNNER_TEMP/xcodebuild.log" \
            | { grep -E "error:|EXPORT (SUCCEEDED|FAILED)" || true; }
          rm -f "$key"
          ipa="$RUNNER_TEMP/LocalDesktop-$VERSION.ipa"
          mv "$RUNNER_TEMP/ios/LocalDesktopClient.ipa" "$ipa"
          echo "IPA=$ipa" >> "$GITHUB_ENV"

      - name: Check the iPhone app
        run: |
          dir="$RUNNER_TEMP/ipa"
          unzip -q "$IPA" -d "$dir"
          app="$dir/Payload/LocalDesktopClient.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          grep -q "Authority=Apple Distribution" <<< "$(codesign -dvv "$app" 2>&1)" \
            || { echo "::error::The iPhone app is not signed for distribution"; exit 1; }
          version="$(plutil -extract CFBundleShortVersionString raw -o - "$app/Info.plist")"
          [[ "$version" == "$VERSION" ]] \
            || { echo "::error::The iPhone app is version $version, not $VERSION"; exit 1; }
          security cms -D -i "$app/embedded.mobileprovision" > "$dir/profile.plist"
          [[ "$(plutil -extract Entitlements.get-task-allow raw -o - "$dir/profile.plist")" == false ]] \
            || { echo "::error::The iPhone app has a development profile, not Ad Hoc"; exit 1; }
          devices="$(plutil -extract ProvisionedDevices raw -o - "$dir/profile.plist")"
          expires="$(plutil -extract ExpirationDate raw -o - "$dir/profile.plist")"
          (( devices > 0 )) || { echo "::error::The Ad Hoc profile lists no devices"; exit 1; }
          echo "iPhone and iPad app: Ad Hoc for $devices registered devices, runs until $expires." >> "$GITHUB_STEP_SUMMARY"
          # Xcode reuses the profile until it expires, and every release signed with
          # it stops opening then.
          days_left=$(( ($(date -j -u -f "%Y-%m-%dT%H:%M:%SZ" "$expires" +%s) - $(date +%s)) / 86400 ))
          if (( days_left < 60 )); then
            echo "::warning::The Ad Hoc profile expires in $days_left days ($expires). Delete it in the developer account and release again for a new one (docs/RELEASING.md)."
          fi

      - name: Notarize the app
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/LocalDesktop-notarize.zip"
          Scripts/notarize.sh "$RUNNER_TEMP/LocalDesktop-notarize.zip"
          xcrun stapler staple "$APP"

      - name: Build and notarize the DMG
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          dmg="$RUNNER_TEMP/LocalDesktop-$VERSION.dmg"
          Scripts/make-dmg.sh "$APP" "$dmg" "LocalDesktop $VERSION"
          codesign --sign "Developer ID Application" --timestamp --keychain "$KEYCHAIN" "$dmg"
          Scripts/notarize.sh "$dmg"
          xcrun stapler staple "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      - name: Create the draft release
        run: |
          # Served by the Install page workflow once this release is published.
          owner="$(tr '[:upper:]' '[:lower:]' <<< "$GITHUB_REPOSITORY_OWNER")"
          INSTALL_PAGE="https://$owner.github.io/${GITHUB_REPOSITORY#*/}/"
          # GitHub's generated notes list merged pull requests, and this
          # repository is committed to directly: list the commits instead.
          previous="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 1 --json tagName --jq '.[0].tagName // empty')"
          {
            cat <<EOF
          ## Install

          **Mac:** open LocalDesktop-$VERSION.dmg and drag LocalDesktop to Applications, then open it. The Setup Assistant asks for the Screen Recording and Accessibility permissions and a PIN. Requires macOS 14 or later.

          **iPhone and iPad:** open $INSTALL_PAGE in Safari on the device and tap Install. LocalDesktop-$VERSION.ipa is an Ad Hoc build: it installs only on devices registered with the developer account. Requires iOS 17 or later.

          **Updating:** the Mac app offers new versions by itself (menu bar icon → gear → Check for Updates…), and so does the iPhone app from 1.2 on (a banner on its main screen). Use the same version of both apps.

          ## Changes

          EOF
            if [[ -n "$previous" ]]; then
              git log --no-merges --reverse --format='- %s' "$previous..HEAD"
              printf '\n**Full changelog:** https://github.com/%s/compare/%s...v%s\n' "$GITHUB_REPOSITORY" "$previous" "$VERSION"
            else
              echo "First release."
            fi
          } > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" "$DMG" "$IPA" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LocalDesktop $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --draft
          echo "Draft release created: edit the notes and publish it under Releases." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove the signing keychain
        if: always()
        run: |
          [[ -n "${KEYCHAIN:-}" ]] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
